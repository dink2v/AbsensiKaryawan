name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-apk-build
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Firebase configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "::error::Missing repository secret FIREBASE_GOOGLE_SERVICES_JSON. Add the contents of app/google-services.json in Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$FIREBASE_CONFIG" > app/google-services.json
          python3 -m json.tool app/google-services.json > /dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: absensi-karyawan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
